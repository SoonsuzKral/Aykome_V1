<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aykome E-İmza</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background: #16213e;
      border-radius: 12px;
      padding: 32px;
      width: 380px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .icon {
      text-align: center;
      font-size: 48px;
      margin-bottom: 16px;
    }
    h2 {
      text-align: center;
      color: #0f3460;
      margin-bottom: 24px;
      font-size: 18px;
    }
    .info {
      background: #0f3460;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 13px;
      line-height: 1.6;
    }
    .info strong { color: #e94560; }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 14px;
      margin-bottom: 6px;
      color: #a0a0b0;
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      background: #1a1a2e;
      border: 1px solid #0f3460;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 18px;
      letter-spacing: 4px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      border-color: #e94560;
    }
    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }
    .buttons button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .buttons button:hover { opacity: 0.9; }
    .btn-cancel {
      background: #2a2a4a;
      color: #a0a0b0;
    }
    .btn-sign {
      background: #e94560;
      color: white;
    }
    .btn-sign:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .error {
      background: #3a1a1a;
      color: #ff6b6b;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }
    .status {
      text-align: center;
      font-size: 13px;
      margin-top: 16px;
      color: #666;
    }
    .loading {
      display: none;
      text-align: center;
      margin-top: 16px;
    }
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid #0f3460;
      border-top-color: #e94560;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🖊️</div>
    <h2>E-İmza İşlemi</h2>

    <div class="info" id="info">
      <div><strong>Belge:</strong> Yükleniyor...</div>
    </div>

    <div class="form-group">
      <label for="pin">Token PIN'inizi girin</label>
      <input type="password" id="pin" placeholder="••••••" maxlength="16" autofocus>
    </div>

    <div class="buttons">
      <button class="btn-cancel" onclick="cancelSign()">İptal</button>
      <button class="btn-sign" id="signBtn" onclick="signPdf()">İmzala</button>
    </div>

    <div class="error" id="error"></div>
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div style="margin-top: 8px">İmzalanıyor...</div>
    </div>
    <div class="status" id="status"></div>
  </div>

  <script>
    document.getElementById('pin').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') signPdf();
    });

    document.getElementById('pin').focus();

    window.eImza.getSettings().then(settings => {
      document.getElementById('info').innerHTML =
        '<div><strong>Sunucu:</strong> ' + (settings.server_url || 'Ayarlanmamış') + '</div>';
    });

    async function signPdf() {
      const pin = document.getElementById('pin').value.trim();
      if (!pin) {
        showError('Lütfen PIN girin');
        return;
      }

      setLoading(true);
      hideError();

      const result = await window.eImza.signPdf({ pin });
      setLoading(false);

      if (result.error) {
        showError(result.error);
        return;
      }

      if (result.success) {
        document.getElementById('status').textContent = '✅ İmza başarıyla tamamlandı!';
        document.getElementById('status').style.color = '#4caf50';
        document.getElementById('pin').value = '';
        document.getElementById('signBtn').disabled = true;
        setTimeout(() => window.eImza.cancelSign(), 2000);
      }
    }

    async function cancelSign() {
      await window.eImza.cancelSign();
    }

    function showError(msg) {
      const el = document.getElementById('error');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function hideError() {
      document.getElementById('error').style.display = 'none';
    }

    function setLoading(loading) {
      document.getElementById('loading').style.display = loading ? 'block' : 'none';
      document.getElementById('signBtn').disabled = loading;
      document.getElementById('pin').disabled = loading;
    }
  </script>
</body>
</html>
