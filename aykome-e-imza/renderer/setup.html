<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eyyübiye AYKOME - E-İmza Kurulum</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background: #1e293b;
      border-radius: 12px;
      padding: 32px;
      width: 500px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    h2 { text-align: center; margin-bottom: 24px; color: #f1f5f9; font-size: 20px; }
    .icon-header { text-align: center; font-size: 40px; margin-bottom: 8px; }
    .step { margin-bottom: 20px; }
    .step-header {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #94a3b8;
    }
    .step.active .step-header { color: #f1f5f9; }
    .step-content { padding: 0 0 0 16px; }
    select, input {
      width: 100%;
      padding: 10px 14px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 14px;
      outline: none;
    }
    select:focus, input:focus { border-color: #94a3b8; }
    select { cursor: pointer; }
    .btn {
      width: 100%;
      padding: 12px;
      background: #334155;
      color: #f1f5f9;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
    }
    .btn:hover { background: #475569; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary {
      background: #1e293b;
      border: 1px solid #475569;
      margin-top: 8px;
    }
    .btn-secondary:hover { background: #334155; }
    .btn-success {
      background: #134e4a;
    }
    .btn-success:hover { background: #155e5b; }
    .info {
      font-size: 13px;
      color: #94a3b8;
      margin: 8px 0;
      line-height: 1.5;
    }
    .result { margin-top: 12px; padding: 12px; border-radius: 8px; font-size: 13px; display: none; }
    .result.success { display: block; background: #134e4a; color: #5eead4; }
    .result.error { display: block; background: #3f1d1d; color: #fca5a5; }
    .result.info { display: block; background: #0f172a; color: #cbd5e1; }
    .step-indicator {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }
    .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #334155;
    }
    .dot.active { background: #f1f5f9; }
    .dot.done { background: #34d399; }
    .sim-badge {
      display: inline-block;
      background: #475569;
      color: #e2e8f0;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      margin-left: 6px;
    }
    .token-panel {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 12px;
      font-size: 13px;
      line-height: 1.6;
      display: none;
    }
    .token-panel .badge-aktif {
      display: inline-block;
      background: #134e4a;
      color: #5eead4;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      margin-left: 6px;
    }
    .token-panel .badge-yok {
      display: inline-block;
      background: #3f1d1d;
      color: #fca5a5;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      margin-left: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-header">🔐</div>
    <h2>AYKOME E-İmza Uygulaması</h2>

    <div class="token-panel" id="tokenPanel" style="display:block;">
      <div style="font-size:15px; font-weight:600; margin-bottom:12px; color:#f1f5f9;">💳 AKILLI KART BİLGİSİ</div>
      <div id="tokenDetail" style="font-size:14px; line-height:1.8;">Taranıyor...</div>
    </div>

    <div class="step active" id="step1" style="display:none;">
      <div class="step-header">AKIS Kütüphanesi Kontrolü</div>
      <div class="step-content">
        <div class="info" id="pkcs11Status">Otomatik taranıyor...</div>
      </div>
    </div>

    <div class="step" id="step2" style="margin-top:16px;">
      <div class="step-header" style="font-size:15px; margin-bottom:12px;">Sunucu Bağlantısı</div>
      <div class="step-content">
        <label style="font-size:13px; color:#94a3b8; margin-bottom:6px; display:block;">Sunucu Adresi</label>
        <input type="text" id="serverUrl" value="http://127.0.0.1:8001" placeholder="https://belediye.gov.tr" style="margin-bottom:12px;">
        <label style="font-size:13px; color:#94a3b8; margin-bottom:6px; display:block;">API Anahtarı</label>
        <input type="text" id="apiKey" value="eimza_aykome_dev_2026" placeholder="API anahtarı" style="font-size:13px;">
      </div>
    </div>

    <div class="result" id="result"></div>

    <button class="btn" id="mainBtn" onclick="finishSetup()" style="margin-top:24px; background:#0891b2; font-size:16px;">🚀 Başlat ve Hazır Ol</button>
    <div class="info" style="text-align:center; margin-top:12px; font-size:12px; color:#64748b;">
      Uygulama sistem tepsisinde (systray) çalışacak
    </div>
  </div>

  <script>
    let p11Path = '';
    let certSerial = '';

    // OTOMATIK AKIS KONTROLÜ - Açılışta akisp11.dll aranır
    async function autoDetectAKIS() {
      const status = document.getElementById('pkcs11Status');
      status.textContent = '🔍 AKIS kütüphanesi aranıyor...';

      const result = await window.eImza.scanTokens();

      if (result.error) {
        status.innerHTML = '❌ AKIS bulunamadı: ' + result.error;
        return;
      }

      if (Array.isArray(result) && result.length > 0) {
        // AKIS kütüphanesini bul (akisp11.dll)
        const akisLib = result.find(lib => lib.path.toLowerCase().includes('akis'));
        if (akisLib) {
          p11Path = akisLib.path;
          status.innerHTML = '✅ AKIS kütüphanesi bulundu: ' + akisLib.label;
          console.log('AKIS otomatik seçildi:', p11Path);
        } else if (result.length > 0) {
          // AKIS yoksa ilk kütüphaneyi al
          p11Path = result[0].path;
          status.innerHTML = '⚠️ AKIS bulunamadı, varsayılan kütüphane seçildi: ' + result[0].label;
        }
      } else {
        status.innerHTML = '⚠️ PKCS#11 kütüphanesi bulunamadı. E-Tüğra yazılımı yüklü mü?';
      }
    }

    async function finishSetup() {
      const serverUrl = document.getElementById('serverUrl').value.trim();
      const apiKey = document.getElementById('apiKey').value.trim();

      if (!serverUrl) {
        showResult('Lütfen sunucu adresini girin.', 'error');
        return;
      }

      if (!p11Path) {
        showResult('❌ AKIS kütüphanesi bulunamadı. E-Tüğra yazılımını yükleyin.', 'error');
        return;
      }

      const settings = {
        pkcs11_path: p11Path,
        cert_serial: certSerial || 'AUTO',
        server_url: serverUrl,
        api_key: apiKey,
        setup_complete: true,
      };

      const result = await window.eImza.saveSettings(settings);

      if (result.saved) {
        showResult('✅ Kurulum tamamlandı!<br>Uygulama sistem tepsisinde çalışmaya devam edecek.', 'success');
        document.getElementById('mainBtn').disabled = true;
        document.getElementById('mainBtn').textContent = '✅ Hazır';
        setTimeout(function() { window.eImza.closeSetup(); }, 2000);
      }
    }

    function showResult(msg, type) {
      var el = document.getElementById('result');
      el.innerHTML = msg;
      el.className = 'result ' + type;
    }

    function hideResult() {
      document.getElementById('result').style.display = 'none';
    }

    // Mevcut ayarları yükle
    window.eImza.getSettings().then(function(settings) {
      if (settings.server_url) document.getElementById('serverUrl').value = settings.server_url;
      if (settings.api_key) document.getElementById('apiKey').value = settings.api_key;
    });

    // KART SAHİBİ BİLGİSİ GÖSTERİMİ
    function refreshTokenDurum() {
      window.eImza.tokenDurumu().then(function(t) {
        var detail = document.getElementById('tokenDetail');
        var isim = t.sertifikaCN || '— KART TAKILI DEĞİL';
        
        if (t.durum === 'aktif') {
          certSerial = t.certSerial || 'AUTO';
          detail.innerHTML = 
            '<div style="display:flex; align-items:center; gap:12px; margin-bottom:8px;">' +
              '<div style="font-size:32px;">👤</div>' +
              '<div style="flex:1;">' +
                '<div style="font-size:16px; font-weight:700; color:#5eead4; margin-bottom:4px;">' + isim + '</div>' +
                '<div style="font-size:12px; color:#94a3b8;">' + (t.tokenLabel || 'E-Tüğra Token') + '</div>' +
              '</div>' +
              '<div><span class="badge-aktif" style="padding:6px 12px; font-size:12px;">✅ AKTİF</span></div>' +
            '</div>' +
            (t.certSerial ? '<div style="font-size:11px; color:#64748b; padding:8px 12px; background:#0f172a; border-radius:6px;">Sertifika Seri: <code style="color:#94a3b8;">' + t.certSerial + '</code></div>' : '');
        } else if (t.durum === 'kutuphane') {
          detail.innerHTML = 
            '<div style="display:flex; align-items:center; gap:12px;">' +
              '<div style="font-size:32px;">🚫</div>' +
              '<div style="flex:1;">' +
                '<div style="font-size:16px; font-weight:700; color:#fca5a5; margin-bottom:4px;">KART TAKILI DEĞİL</div>' +
                '<div style="font-size:12px; color:#94a3b8;">Kütüphane bulundu, token algılanamadı</div>' +
              '</div>' +
            '</div>';
        } else {
          detail.innerHTML = 
            '<div style="display:flex; align-items:center; gap:12px;">' +
              '<div style="font-size:32px;">⚠️</div>' +
              '<div style="flex:1;">' +
                '<div style="font-size:16px; font-weight:700; color:#fbbf24; margin-bottom:4px;">TOKEN TESPİT EDİLEMEDİ</div>' +
                '<div style="font-size:12px; color:#94a3b8;">E-Tüğra yazılımını yükleyin ve kartı takın</div>' +
              '</div>' +
            '</div>';
        }
      });
    }

    // OTOMATIK BAŞLATMA
    autoDetectAKIS();
    refreshTokenDurum();

    // CANLI TOKEN ALGILAMA - Kart takılıp çıkartılınca anında güncelle
    if (window.eImza.onSlotDetect) {
      window.eImza.onSlotDetect(function () {
        refreshTokenDurum();
      });
    }

    // 3 saniyede bir yenile
    setInterval(refreshTokenDurum, 3000);
  </script>
</body>
</html>
