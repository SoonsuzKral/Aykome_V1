  /api/v1/demands/bulk:
    post:
      tags: [Demands]
      summary: Toplu sözleşme oluştur (tek şablondan N alıcı)
      x-required-scope: demands:write
      description: |
        Tek şablondan en fazla 10 alıcıya AYRI AYRI sözleşme oluşturur ve
        her birine imza daveti gönderir (DocuSign "bulk send" modeli). Her
        satır bağımsız bir sözleşmedir; satır-başı kısmi başarı raporlanır.

        **Davranış:**
        - `rows` en fazla 10 (aşarsa 400 `BULK_MAX_10`). Daha büyük listeler
          istemci tarafında 10'arlı parçalara bölünür.
        - Kredi: her satır 1 kredi. İstek başında `checkAvailability(N)`
          yeterlilik kontrolü (yetersizse 402, hiçbir sözleşme yaratılmaz);
          ayrıca satır-başı guard.
        - Şablon sahipliği istek başında bir kez doğrulanır (workspace-scoped;
          başka workspace'in şablonu 404).
        - Kısmi başarı normaldir: batch tamamlanınca HTTP 200 döner (bazı
          satırlar `failed` olsa bile). Yalnızca ön-kontrol redleri
          (cap/kredi/sahiplik) 400/402/404 döner.
        - `X-Workspace-Id` header'ı ile organizasyon workspace'i seçilebilir.

        Rate limit: 5 istek/dakika (API key başına).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template_id, rows]
              properties:
                template_id: { type: string, format: uuid, description: Sözleşmelerin oluşturulacağı şablon }
                options:
                  type: object
                  description: Tüm satırlara uygulanan batch-seviye seçenekler (opsiyonel)
                  properties:
                    dispatch_notifications: { type: boolean, default: true, description: false ise davet gönderilmez (yalnızca oluşturulur) }
                    ordered: { type: boolean, description: true ise taraflar sırayla imzalar }
                    sms_content: { type: string, description: SMS davet metni özelleştirmesi (yalnızca kendi SMS sağlayıcısı olan org'lar) }
                    language: { type: string, example: tr }
                rows:
                  type: array
                  minItems: 1
                  maxItems: 10
                  description: Her biri ayrı bir sözleşme olacak satırlar (en fazla 10)
                  items:
                    type: object
                    required: [party_mapping]
                    properties:
                      party_mapping:
                        type: array
                        description: Bu satırın taraf eşlemesi (POST /demands ile aynı şekil)
                        items:
                          type: object
                          properties:
                            template_party_id: { type: string, format: uuid }
                            first_name: { type: string }
                            last_name: { type: string }
                            email: { type: string, format: email }
                            phone: { type: string }
                            variables: { type: object, description: Bu tarafa özel değişkenler }
                      variables: { type: object, description: Satır-kök değişkenler }
      responses:
        '200':
          description: |
            Batch tamamlandı (kısmi başarı dahil). `results` giriş sırasında,
            her satır `row_index` ile eşlenir.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      template_id: { type: string, format: uuid }
                      total: { type: integer, example: 3 }
                      created: { type: integer, example: 2 }
                      failed: { type: integer, example: 1 }
                      results:
                        type: array
                        items:
                          type: object
                          properties:
                            row_index: { type: integer }
                            status: { type: string, enum: [created, failed] }
                            demand_id: { type: string, format: uuid, description: status=created ise }
                            signing_urls:
                              type: array
                              items:
                                type: object
                                properties:
                                  party_id: { type: string, format: uuid }
                                  first_name: { type: string }
                                  last_name: { type: string }
                                  email: { type: string }
                                  phone: { type: string }
                                  signing_url: { type: string, format: uri }
                            result_url: { type: string, format: uri }
                            dispatched: { type: integer, description: Gönderilen davet (SMS+e-posta) sayısı }
                            error: { type: string, description: status=failed ise makinece okunabilir kod }
                            message: { type: string, description: status=failed ise açıklama }
        '400':
          description: |
            Geçersiz istek. Olası: `BULK_MAX_10` (rows > 10), boş rows,
            template_id eksik.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402':
          description: INSUFFICIENT_CREDITS — N satır için yeterli kredi yok (hiçbir sözleşme yaratılmadı)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '403':
          description: INSUFFICIENT_SCOPE (demands:write yok) veya SMS_CUSTOMIZATION_NOT_ALLOWED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429':
          description: Rate limit aşıldı (5 toplu istek/dakika per API key)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/demands/{id}:
