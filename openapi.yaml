        - { name: from, in: query, required: false, schema: { type: string, format: date }, description: Başlangıç tarihi (dahil). }
        - { name: to, in: query, required: false, schema: { type: string, format: date }, description: Bitiş tarihi (dahil). }
        - name: sort
          in: query
          required: false
          schema: { type: string, default: '-createdAt' }
          description: |
            Sıralama. `-` öneki azalan demektir (ör. `-createdAt`,
            `timestamp_date`). Legacy `sort_by` + `sort_order` de kabul edilir.
      responses:
        '200':
          description: Başarılı
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      timestamps:
                        type: array
                        items: { $ref: '#/components/schemas/TimestampListItem' }
                      total: { type: integer, example: 42 }
                      page: { type: integer, example: 1 }
                      limit: { type: integer, example: 25 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: INSUFFICIENT_SCOPE — API key'de timestamps scope yok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/timestamps/{id}:
