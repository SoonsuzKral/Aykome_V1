        yalnızca sözleşme başlığı/durumu + imzacı SAYILARI döner (`parties_total`,
        `parties_signed`). Taraf adı/e-posta/telefon ve ham IP/cihaz/TC/konum HİÇ
        döndürülmez — taraf detayı için `GET /demands/{id}`.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [DRAFT, PENDING, COMPLETED, CANCELLED, EXPIRED] } }
        - { name: q, in: query, schema: { type: string }, description: Başlık araması }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: template_id, in: query, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20 }, description: Sayfa boyutu (page_size ile aynı) }
        - { name: sort, in: query, schema: { type: string }, description: "alan:yön (ör. createdAt:desc)" }
      responses:
